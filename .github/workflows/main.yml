name: StockFlow API CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.4"
  POSTGRES_USER: stockflow
  POSTGRES_PASSWORD: stockflow_secret_password
  POSTGRES_DB: stockflow_test_db
  POSTGRES_PORT: 5432

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Integration Tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow_secret_password
          POSTGRES_DB: stockflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install "poetry==${POETRY_VERSION}"

      - name: Configure Poetry virtualenv in project
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run Ruff Linter
        run: poetry run ruff check src tests

      - name: Run Ruff Formatter Check
        run: poetry run ruff format --check src tests

      - name: Run Mypy Static Type Checker
        run: poetry run mypy src tests

      - name: Run Alembic Migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://stockflow:stockflow_secret_password@localhost:5432/stockflow_test_db
        run: poetry run alembic upgrade head

      - name: Run Unit, Integration & Concurrency Stress Tests
        env:
          DATABASE_URL: postgresql+asyncpg://stockflow:stockflow_secret_password@localhost:5432/stockflow_test_db
          TEST_DATABASE_URL: postgresql+asyncpg://stockflow:stockflow_secret_password@localhost:5432/stockflow_test_db
        run: poetry run pytest --cov=stockflow --cov-report=term-missing

  frontend-check:
    name: Build & Typecheck Frontend (React / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests (Vitest & React Testing Library)
        working-directory: frontend
        run: npm test

      - name: Build and typecheck frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Production Docker Images (Backend & Frontend)
    needs: [quality-and-tests, frontend-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stockflow-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: stockflow-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    name: Deploy Live Demo (GitHub Pages)
    needs: [quality-and-tests, frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for GitHub Pages
        working-directory: frontend
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
